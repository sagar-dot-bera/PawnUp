# Render blueprint for the backend. Free plan: one instance, sleeps after 15 min idle,
# may restart at any time (see DESIGN.md: live games are rebuilt from the database).
services:
  - type: web
    name: pawnup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pawnup.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL # Neon connection string (Session 3)
        sync: false
      - key: JWT_SECRET # long random string (Session 3)
        sync: false
      - key: CORS_ORIGINS # the Vercel site URL, comma separated
        sync: false
